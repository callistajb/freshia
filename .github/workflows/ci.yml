name: Freshia CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test_and_build:
    name: Lint, Test, & Web Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Execute Automated Unit Tests & Coverage
        run: npm test

      - name: Build Web Production Bundle (Expo Export)
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY }}
          EXPO_PUBLIC_ROBOFLOW_API_KEY: ${{ secrets.EXPO_PUBLIC_ROBOFLOW_API_KEY }}
          EXPO_PUBLIC_ROBOFLOW_MODEL_ID: ${{ secrets.EXPO_PUBLIC_ROBOFLOW_MODEL_ID }}
          EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME: ${{ secrets.EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME }}
          EXPO_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.EXPO_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: freshia-web-dist
          path: dist/
          retention-days: 14
